[project]
name = "dataweave"
version = "0.1.0"
description = "Document intelligence and RAG preparation engine"
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

